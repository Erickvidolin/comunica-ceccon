<!doctype html><html lang="pt-BR" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IASD Jardim Ceccon — Anúncios</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0b0b0c;--char:#18181b;--gold:#c8a24c;--gl:#f1d994;--gd:#8f6b22;--bg:#faf8f3;--card:#fff;--tx:#1c1b18;--mut:#6b6659;--bd:#e7dfca;--sky:#f6f0df;--ttl:#111;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--gg:linear-gradient(135deg,#f6e3a8 0%,#c8a24c 50%,#8f6b22 100%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--card:#17171a;--tx:#efe9da;--mut:#a39b88;--bd:#3a3220;--sky:#211d12;--ttl:#f1d994}}
:root[data-theme="dark"]{--bg:#0b0b0c;--card:#17171a;--tx:#efe9da;--mut:#a39b88;--bd:#3a3220;--sky:#211d12;--ttl:#f1d994}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Lato,system-ui,-apple-system,"Segoe UI",sans-serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:radial-gradient(ellipse at 15% -40%,#3a3425 0,#141412 55%,#0b0b0c 100%);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 18px;border-bottom:1px solid var(--gold);box-shadow:0 6px 18px #0009,0 1px 0 #f1d99455 inset}
.logo{width:46px;height:46px;display:block;background:var(--gg);filter:drop-shadow(0 2px 3px #000c) drop-shadow(0 0 6px #c8a24c55);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
nav b{display:block;line-height:1.05;font:700 1.4rem/1.05 var(--serif);letter-spacing:.04em;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
nav small{color:#d9cfb4;opacity:.85;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
nav .sp{flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--gold);border-radius:999px;padding:8px 18px;background:linear-gradient(#26241e,#0b0b0c);color:var(--gl);text-decoration:none;display:inline-block;box-shadow:0 3px 8px #0004,0 1px 0 #f1d99433 inset;transition:transform .15s,box-shadow .15s}
button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px #0006}
button.gold{background:var(--gg);color:#1b1405;font-weight:700;border-color:#e8cd85}
button.ghost{background:transparent;border:1px solid currentColor;color:var(--gl);box-shadow:none}
button.red{background:linear-gradient(#a33a33,#6d1f1b);color:#fff;border-color:#a33a33}
.hero{aspect-ratio:16/9;max-height:100vh;width:100%;background:#0b0b0c center/cover no-repeat;box-shadow:0 14px 28px -10px #000a;position:relative}
.hero:after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,#0b0b0c55)}
main{max-width:1100px;margin:0 auto;padding:30px 16px 44px}
.shead{text-align:center;margin-bottom:22px}
.shead h2{margin:0;font:700 2.2rem/1.1 var(--serif);color:var(--ttl);letter-spacing:.04em}
.shead i{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;color:var(--gold)}
.shead i:before,.shead i:after{content:"";width:90px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.shead i:after{transform:scaleX(-1)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px 6px 16px 16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px #0002,0 8px 18px -6px #0003,0 22px 40px -18px #0004;position:relative;transition:transform .2s,box-shadow .2s}
.card:before{content:"";height:3px;background:var(--gg);display:block}
.card:hover{transform:translateY(-4px);box-shadow:0 2px 4px #0002,0 14px 26px -6px #0004,0 30px 50px -18px #0005}
.card img,.ph{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#111}
.ph{display:grid;place-items:center;color:var(--gold);font-size:44px;background:radial-gradient(circle at 30% 20%,#3a3425,#0b0b0c)}
.body{padding:16px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h2{margin:0;font:700 1.5rem/1.2 var(--serif);color:var(--ttl)}
.date{font-size:.75rem;color:var(--gd);letter-spacing:.14em;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .date{color:var(--gold)}}
:root[data-theme="dark"] .date{color:var(--gold)}
.txt{white-space:pre-line;margin:0}
.sec{background:var(--sky);border-left:3px solid var(--gold);border-radius:4px 8px 8px 4px;padding:8px 12px;font-size:.9rem;box-shadow:inset 0 1px 3px #0002}
.sec h4{margin:0 0 2px;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--gd)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec h4{color:var(--gold)}}
:root[data-theme="dark"] .sec h4{color:var(--gold)}
.links{display:flex;flex-wrap:wrap;gap:6px}.links a{padding:5px 14px;font-size:.88rem}
.act{display:flex;gap:8px;margin-top:auto}
.empty{text-align:center;color:var(--mut);padding:40px 0}
#modal{position:fixed;inset:0;background:radial-gradient(circle at 20% 0,#000b,#000e);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}
#modal.on{display:flex}
.box{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:520px;margin:auto;border-top:3px solid var(--gold);box-shadow:0 30px 60px -10px #000}
.box h3{margin:0 0 10px;font:700 1.7rem var(--serif);color:var(--ttl)}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 3px}
input,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);box-shadow:inset 0 1px 3px #0002}
input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
textarea{min-height:80px;resize:vertical}
.prev{max-width:100%;max-height:150px;border-radius:8px;margin-top:6px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.err{color:#c0392b;font-size:.85rem;margin-top:6px}
footer{text-align:center;color:#d9cfb4;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 300' preserveAspectRatio='xMaxYMid slice'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23f1d994'/%3E%3Cstop offset='1' stop-color='%238f6b22'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg fill='none' stroke='url(%23g)' stroke-width='1.5'%3E%3Cpath d='M600 -20C500 40 430 120 380 330' opacity='.9'/%3E%3Cpath d='M600 20C520 70 465 140 430 330' opacity='.7'/%3E%3Cpath d='M600 70C540 110 500 170 480 330' opacity='.5'/%3E%3C/g%3E%3C/svg%3E") right center/cover no-repeat,radial-gradient(ellipse at 20% 0,#2c281c 0,#0b0b0c 70%);border-top:1px solid var(--gold);padding:26px 16px 32px;font:600 1.15rem var(--serif);letter-spacing:.06em;box-shadow:0 -10px 24px -12px #0006}
.lr{display:flex;gap:6px;margin-bottom:6px}.lr .ln{flex:0 0 38%}.lr .lu{flex:1;min-width:0}.lr button{padding:4px 12px}

.grid{grid-template-columns:1fr;gap:28px}
.card{flex-direction:row;min-height:280px}
.card:before{position:absolute;top:0;left:0;right:0;z-index:2}
.card img,.ph{flex:0 0 46%;width:46%;aspect-ratio:auto;height:auto;align-self:stretch;min-height:280px;object-fit:cover}
.card:nth-child(even){flex-direction:row-reverse}
.body{padding:26px 30px;justify-content:center}
.body h2{font-size:1.8rem}
@media (max-width:720px){.card,.card:nth-child(even){flex-direction:column;min-height:0}.card img,.ph{flex:none;width:100%;aspect-ratio:16/10;min-height:0}.body{padding:16px 18px;justify-content:flex-start}.body h2{font-size:1.5rem}}
.card{cursor:pointer}.more{color:var(--gold);font-weight:700;font-size:.85rem;letter-spacing:.06em}
.box.view{max-width:780px;padding:0;overflow:hidden;position:relative}
.box.view img,.box.view .ph{width:100%;flex:none;aspect-ratio:16/10;max-height:440px;min-height:0;height:auto;object-fit:cover;display:block}
.vb{padding:22px 26px 28px;display:flex;flex-direction:column;gap:12px}.vb h3{margin:0;font-size:2rem}
.xbtn{position:absolute;top:10px;right:10px;width:38px;height:38px;padding:0;border-radius:50%;z-index:2;font-size:1.3rem;line-height:1;background:#0b0b0ccc}
.act{flex-wrap:wrap}.box button.ghost{color:var(--tx)}
.esc{background:radial-gradient(ellipse at 12% -20%,#4a4129 0,#17150f 50%,#0b0b0c 100%);color:#efe6cf;border:1px solid var(--gold);border-radius:8px 8px 18px 18px;padding:22px 24px 26px;margin-bottom:28px;position:relative;box-shadow:0 1px 2px #0003,0 12px 24px -8px #0006,0 30px 50px -20px #000a,0 1px 0 #f1d99444 inset}
.esc:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gg);border-radius:8px 8px 0 0}
.eh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.esc .date{color:var(--gold)}.esc h2{margin:2px 0 0;font:700 2rem/1.1 var(--serif);background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.ed{text-transform:capitalize;color:#d9cfb4;font-family:var(--serif);font-size:1.2rem}
.eg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ei{background:#ffffff0d;border:1px solid #c8a24c44;border-left:3px solid var(--gold);border-radius:4px 10px 10px 4px;padding:10px 14px;box-shadow:0 6px 14px -6px #000a,0 1px 0 #ffffff14 inset}
.ei h4{margin:0 0 4px;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--gl)}
.nd{opacity:.55;font-style:italic}.stale{margin:0 0 12px;color:var(--gl);font-style:italic}

.card{height:380px;min-height:0}
.card img,.card .ph{min-height:0;height:100%}
.card .body{overflow:hidden;padding:22px 28px;gap:8px}
.card .body h2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .txt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .sec{max-height:84px;overflow:hidden}
.card .links{max-height:72px;overflow:hidden}
.eg{grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr}
.ei{min-width:0;overflow-wrap:anywhere}
@media (max-width:720px){.card,.card:nth-child(even){height:auto}.card img,.card .ph{height:auto}.card .body{min-height:230px;padding:16px 18px}}
@media (max-width:520px){.eg{grid-template-columns:repeat(2,1fr)}.esc{padding:18px 14px 20px}}

.card{height:480px}
.card .body{padding:28px 32px;gap:10px}
.card .body h2{font-size:1.9rem}
.card .txt{-webkit-line-clamp:6}
.card .sec{max-height:110px}
.card .links{max-height:96px}
@media (max-width:720px){.card,.card:nth-child(even){height:auto}.card img,.card .ph{aspect-ratio:4/3}.card .body{min-height:260px;padding:18px 20px}.card .body h2{font-size:1.6rem}.card .txt{-webkit-line-clamp:5}}
</style></head><body>

function render(){
  $('#navbtns').innerHTML=admin?'<button class="ghost" data-a="out">Sair</button>':'<button class="gold" data-a="login">'+(hasAdm===false?'Primeiro acesso':'Login')+'</button>';
  const imp=admin&&loaded&&!ads.length&&L.ads&&L.ads.length;
  $('#bar').innerHTML=admin?'<span>Modo administrador</span><span>'+(imp?'<button data-a="imp">Importar anúncios anteriores</button> ':'')+'<button class="gold" data-a="new">+ Novo anúncio</button></span>':'';
  const grid=ads.length?'<div class="grid">'+ads.map(a=>`<article class="card" data-a="open" data-id="${a.id}">${a.img?`<img src="${a.img}" alt="">`:'<div class="ph">✝</div>'}<div class="body"><div class="date">${fmt(a.date)}</div><h2>${esc(a.title)}</h2><p class="txt">${esc(a.text)}</p><span class="more">Ver detalhes →</span>${contHTML(a)}${linksHTML(a)}${admin?`<div class="act"><button data-a="first" data-id="${a.id}" title="Colocar em primeiro">★ 1º</button><button data-a="up" data-id="${a.id}" title="Subir">↑</button><button data-a="down" data-id="${a.id}" title="Descer">↓</button><button data-a="edit" data-id="${a.id}">Editar</button><button class="red" data-a="del" data-id="${a.id}">Excluir</button></div>`:''}</div></article>`).join('')+'</div>':'<div class="empty">Nenhum anúncio no momento.</div>';
  $('#root').innerHTML=(err?`<p class="empty">Não foi possível conectar ao banco de dados (${esc(err)}).</p>`:'')+escHTML()+(loaded?grid:'<div class="empty">Carregando anúncios…</div>');
}
function modal(h,c){$('#modal').innerHTML='<div class="box '+(c||'')+'">'+h+'</div>';$('#modal').classList.add('on')}
function close(){$('#modal').classList.remove('on');$('#modal').innerHTML=''}
function loginForm(){
  if(hasAdm===false)modal(`<h3>Primeiro acesso</h3><p class="txt" style="color:var(--mut);margin:0">Ainda não existe administrador. Crie agora o usuário administrador do site. Esta opção só aparece uma vez.</p><label>E-mail</label><input type="email" id="lm" autocomplete="username"><label>Senha (mínimo 6 caracteres)</label><input type="password" id="pw" autocomplete="new-password"><label>Confirmar senha</label><input type="password" id="pw2" autocomplete="new-password"><div class="err" id="er"></div><div class="row"><button class="ghost" data-a="close">Cancelar</button><button class="gold" data-a="mkAdmin">Criar administrador</button></div>`);
  else modal(`<h3>Login do administrador</h3><label>E-mail</label><input type="email" id="lm" autocomplete="username"><label>Senha</label><input type="password" id="pw" autocomplete="current-password"><div class="err" id="er"></div><div class="row"><button class="ghost" data-a="close">Cancelar</button><button class="gold" data-a="doLogin">Entrar</button></div>`);
  $('#lm').focus()}
async function createAdmin(btn){
  const em=$('#lm').value.trim(),p=$('#pw').value,q=$('#pw2').value,er=$('#er');
  if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent='Informe um e-mail válido.';return}
  if(p.length<6){er.textContent='A senha precisa ter pelo menos 6 caracteres.';return}
  if(p!==q){er.textContent='As senhas não conferem.';return}
  btn.disabled=true;btn.textContent='Criando…';let u=null;
  try{const c=await createUserWithEmailAndPassword(auth,em,p);u=c.user;await setDoc(doc(db,'config','admin'),{uid:u.uid,createdAt:serverTimestamp()});close()}
  catch(e){
    if(u){try{await deleteUser(u)}catch(x){}}
    const c=String(e.code);
    er.textContent=c.includes('email-already')?'Este e-mail já está cadastrado.':c.includes('weak')?'Senha fraca. Use outra.':c.includes('invalid-email')?'E-mail inválido.':c.includes('operation-not-allowed')?'Ative o login por E-mail/senha no Firebase Authentication.':c.includes('permission')?'Já existe um administrador. Use o Login.':'Erro: '+(e.code||e.message);
    btn.disabled=false;btn.textContent='Criar administrador'}
}
async function doLogin(){try{await signInWithEmailAndPassword(auth,$('#lm').value.trim(),$('#pw').value);close()}catch(e){$('#er').textContent=String(e.code).includes('network')?'Sem conexão. Tente novamente.':'E-mail ou senha incorretos.'}}
function view(id){const a=ads.find(x=>x.id===id);if(!a)return;
  modal(`<button class="xbtn" data-a="close" title="Fechar">×</button>${a.img?`<img src="${a.img}" alt="">`:'<div class="ph">✝</div>'}<div class="vb"><div class="date">${fmt(a.date)}</div><h3>${esc(a.title)}</h3><p class="txt">${esc(a.text)}</p>${a.details?`<div class="sec"><h4>Informações detalhadas</h4><div class="txt">${esc(a.details)}</div></div>`:''}${contHTML(a)}${linksHTML(a)}</div>`,'view')}
function addLk(l){l=l||{};const d=document.createElement('div');d.className='lr';d.innerHTML='<input class="ln" placeholder="Nome do botão (ex.: Inscrição)" value="'+esc(l.label)+'"><input class="lu" placeholder="https://..." value="'+esc(l.url)+'"><button type="button" class="red" data-a="rmlk" title="Remover link">×</button>';$('#lk').appendChild(d)}
function shrink(f){return new Promise(res=>{const im=new Image();im.onload=()=>{let k=Math.min(1,900/Math.max(im.width,im.height)),q=.72,u;const c=document.createElement('canvas');for(let i=0;i<4;i++){c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);u=c.toDataURL('image/jpeg',q);if(u.length<700000)break;k*=.8;q-=.08}res(u)};im.src=URL.createObjectURL(f)})}
function form(id){
  const a=ads.find(x=>x.id===id)||{title:'',text:'',details:'',contacts:'',links:[],img:''};pendImg=a.img||null;
  modal(`<h3>${id?'Editar':'Novo'} anúncio</h3><label>Título</label><input id="f_t" value="${esc(a.title)}"><label>Imagem</label><input type="file" id="f_i" accept="image/*"><img class="prev" id="pv" ${a.img?`src="${a.img}"`:'hidden'}><label>Texto explicativo (resumo exibido no card)</label><textarea id="f_x">${esc(a.text)}</textarea><label>Informações detalhadas (aparecem ao abrir o anúncio)</label><textarea id="f_d" style="min-height:120px">${esc(a.details||'')}</textarea><label>Contatos (um por linha)</label><textarea id="f_c">${esc(a.contacts)}</textarea><label>Links (nome do botão + endereço)</label><div id="lk"></div><button type="button" class="ghost" data-a="addlk" style="color:var(--gd);margin-top:4px">+ Adicionar link</button><div class="err" id="er"></div><div class="row"><button class="ghost" data-a="close">Cancelar</button><button class="gold" data-a="saveAd" data-id="${id||''}">Salvar</button></div>`);
  (a.links&&a.links.length?a.links:[{}]).forEach(addLk);
  $('#f_i').onchange=async e=>{const f=e.target.files[0];if(!f)return;pendImg=await shrink(f);$('#pv').src=pendImg;$('#pv').hidden=false};
}
async function saveAd(id,btn){
  const t=$('#f_t').value.trim(),x=$('#f_x').value.trim();
  if(!t||!x||!pendImg){$('#er').textContent='Título, imagem e texto são obrigatórios.';return}
  const links=[...document.querySelectorAll('#lk .lr')].map(r=>{let u=r.querySelector('.lu').value.trim();if(u&&!/^[a-z]+:/i.test(u))u='https://'+u;return{label:r.querySelector('.ln').value.trim()||'Acessar',url:u}}).filter(l=>/^https?:\/\//i.test(l.url));
  const o={title:t,text:x,details:$('#f_d').value.trim(),img:pendImg,contacts:$('#f_c').value.trim(),links};
  btn.disabled=true;btn.textContent='Salvando…';
  try{if(id)await updateDoc(doc(db,'anuncios',id),o);else await addDoc(collection(db,'anuncios'),{...o,date:todayISO(),order:minOrder()-1,createdAt:serverTimestamp()});close()}
  catch(e){$('#er').textContent='Erro ao salvar: '+(e.code||e.message);btn.disabled=false;btn.textContent='Salvar'}
}
function formEsc(){modal(`<h3>Escala do próximo sábado</h3><label>Data do sábado</label><input type="date" id="e_d" value="${E.date||nextSat()}">${R.map(([k,l])=>`<label>${l}</label><textarea id="e_${k}" style="min-height:56px">${esc(E[k]||'')}</textarea>`).join('')}<div class="err" id="er"></div><div class="row"><button class="ghost" data-a="close">Cancelar</button><button class="gold" data-a="saveEsc">Salvar</button></div>`)}
async function saveEsc(btn){const o={date:$('#e_d').value||nextSat()};R.forEach(([k])=>o[k]=$('#e_'+k).value.trim());btn.disabled=true;try{await setDoc(doc(db,'config','escala'),o);close()}catch(e){$('#er').textContent='Erro ao salvar: '+(e.code||e.message);btn.disabled=false}}
async function reorder(arr){const b=writeBatch(db);arr.forEach((a,i)=>{if(a.order!==i)b.update(doc(db,'anuncios',a.id),{order:i})});await b.commit()}
function mv(id,d){const i=ads.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=ads.length)return;const arr=[...ads];[arr[i],arr[j]]=[arr[j],arr[i]];reorder(arr).catch(warn)}
function toFirst(id){const i=ads.findIndex(x=>x.id===id);if(i<1)return;reorder([ads[i],...ads.filter((_,k)=>k!==i)]).catch(warn)}
async function importLegacy(){const b=writeBatch(db);L.ads.forEach((a,i)=>b.set(doc(collection(db,'anuncios')),{title:a.title,text:a.text,details:a.details||'',img:a.img||'',contacts:a.contacts||'',links:a.links||[],date:a.date||todayISO(),order:i,createdAt:serverTimestamp()}));if(L.escala&&Object.keys(L.escala).length)b.set(doc(db,'config','escala'),L.escala);await b.commit()}
document.addEventListener('click',e=>{
  if(e.target.closest('a'))return;const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='login')loginForm();else if(a==='mkAdmin')createAdmin(b);else if(a==='doLogin')doLogin();else if(a==='close')close();
  else if(a==='out')signOut(auth);
  else if(a==='open')view(id);else if(a==='editEsc')formEsc();else if(a==='saveEsc')saveEsc(b);
  else if(a==='first')toFirst(id);else if(a==='up')mv(id,-1);else if(a==='down')mv(id,1);
  else if(a==='addlk')addLk();else if(a==='rmlk')b.closest('.lr').remove();
  else if(a==='new')form();else if(a==='edit')form(id);else if(a==='saveAd')saveAd(id,b);
  else if(a==='imp')importLegacy().catch(warn);
  else if(a==='del'&&confirm('Excluir este anúncio?'))deleteDoc(doc(db,'anuncios',id)).catch(warn);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='pw2')){hasAdm===false?createAdmin(document.querySelector('[data-a=mkAdmin]')):doLogin()}});
render();
</script></body></html>
